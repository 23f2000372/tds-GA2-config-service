services:
  - type: web
    name: tds-effective-config
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_WORKERS
        value: "9"
      - key: APP_DEBUG
        value: "false"
      - key: APP_API_KEY
        value: "key-izp9g7yq4a"
